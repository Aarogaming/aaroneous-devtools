global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'aaroneous-core'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['aaroneous:8002']
        labels:
          component: 'core-engine'

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']