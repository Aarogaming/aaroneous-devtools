[package]
name = "foundation_cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Explicit-input foundation tooling for Aaroneous development"

[[bin]]
name = "foundation"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
ast_auditor = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
dashmap = "6"
governance = { workspace = true }
llm_gateway_types = { workspace = true }
llm_gateway = { path = "../../../../Aaroneous/crates/llm_gateway" }
notify = "7"
priority_scheduler = { path = "../priority_scheduler" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sled = "0.34"
tempfile = "3.10"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros", "time", "sync"] }
toml = "0.8"
uuid = { version = "1.0", features = ["v4"] }
gix = "0.66"

[dev-dependencies]
tempfile = "3.10"



