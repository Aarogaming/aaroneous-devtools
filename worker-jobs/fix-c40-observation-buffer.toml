id = "FIX-C40-OBSERVATION-BUFFER"
instruction = """
Codex review finding on Aarogaming/aaroneous#51 (review 5262430957), around
line 309 of crates/ipc_bus/src/observation_buffer.rs:

A reader that opens this mmap before another process records frames caches
self.sequence at open time; the writer only updates its own field and the
mapped header. A long-lived reader's read_latest, current_sequence, and
read_by_sequence therefore never observe subsequent writes -- defeating the
advertised cross-process single-writer/multi-reader stream.

Propose a fix: the reader should acquire the header's atomic write_sequence
field on each read rather than trusting a value cached at open time.

CONSTRAINTS:
- This is an SWMR ring buffer in a hot IPC path: zero heap allocation, no
  locks (Mutex/RwLock) on the read path, preserve the existing lock-free
  design -- use an atomic load with appropriate ordering, not a new
  synchronization primitive.
- Zero ambient authority.
- Zero stubs. Propagate errors via Result.
- Include a unit test that opens a reader before a writer records a frame,
  has the writer record one, and proves the reader now observes it without
  being reconstructed.

This is a proposal only. It does not authorize committing, merging, or
claiming COORDINATION_QUEUE.md row C40/C41 -- that requires owner review per
governance/LOCAL_AGENT_CONTROL_PLANE.md."""
