instruction = """
Codex review finding on Aarogaming/aaroneous#51 (review 5262430957), around
line 179 of crates/si_format/src/verify.rs. Highest-priority of the 9
findings -- this is a crash/abort surface, not just a correctness bug:

A crafted header can set an offset and length whose u64 sum overflows (e.g.
u64::MAX + 1). Debug builds panic here; optimized builds wrap the end to zero
and let the range check pass, then subsequent block slicing panics -- and
under the release panic = "abort" profile this terminates the verifier or
hypervisor process entirely on adversarial input.

Propose a fix using checked addition (checked_add or saturating_add with an
explicit overflow-is-invalid check), validating both the start and end are
in-bounds before any conversion to usize or any slicing operation.

CONSTRAINTS:
- This is a security-relevant input-validation path handling untrusted
  cartridge headers: no unwrap()/expect() on the checked-arithmetic result,
  propagate a real validation error via Result instead.
- Zero heap allocation.
- Zero ambient authority.
- Include a unit test that constructs a header with offset/length summing to
  an overflow (matching the u64::MAX + 1 case described above) and asserts
  verify.rs rejects it with a Result::Err rather than panicking, in both
  debug and release-equivalent arithmetic (use checked_add's None branch,
  which behaves identically in both profiles, rather than relying on
  overflow-checks being enabled)."""
