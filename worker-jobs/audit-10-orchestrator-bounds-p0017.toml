instruction = """
Audit orchestrator crate for ambient authority violations, task routing bounds, and supervisor budget enforcement.

[PRIOR AUDIT CONTEXT - Pass 17]:
In previous invariant audit pass(es), the following observations were noted:
Obs: Static AtomicUsize counter in IntelligenceEngine::new and new_async creates race conditions in multi-instance deployments. | Obs: SharedMemorySynapse::new_sync and new lack explicit size validation or bounds checking before allocation. | Obs: TaskRoutingEngine::new and update_specialist_performance lack documented or enforced supervisor budget limits per task type or agent class. | Risk: Race condition in fallback shared memory key generation may cause collisions in multi-instance environments. | Risk: Ambient authority in SharedMemorySynapse allocation could lead to resource exhaustion if size validation is absent. | Risk: Lack of supervisor budget enforcement in TaskRoutingEngine may allow unbounded task routing and resource consumption.
Verify whether these conditions remain active, have been remediated in the codebase, or if any new invariant violations have emerged since."""
