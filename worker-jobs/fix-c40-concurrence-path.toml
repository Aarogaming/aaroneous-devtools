instruction = """
Codex review finding on Aarogaming/aaroneous#51 (review 5262430957), around
line 1372 of core/hypervisor/bin/hypervisor.rs -- independently re-verified
this session against current source, confirmed real and NOT closed by this
project's own M40 work earlier this session:

`si concurrence` (run_concurrence_pipeline) reads
data/shm/concurrence.shm, but the only real producer in the tree
(write_concurrence_report in core/hypervisor/src/supervisory_loop.rs,
around line 1662) writes JSON to data/concurrence_report.json. `si
concurrence` therefore always reports no data exists even after a daemon has
exported real snapshots.

Propose a fix: repoint run_concurrence_pipeline to read and parse
data/concurrence_report.json (the producer's actual JSON contract) instead
of probing the nonexistent concurrence.shm path.

CONSTRAINTS:
- Match the existing JSON schema write_concurrence_report already produces --
  do not invent a new schema, read what's actually written.
- Zero ambient authority: the data directory path must come from the same
  explicit paths config the rest of the CLI already uses, not a new
  hardcoded or env-derived path.
- Zero stubs. Propagate errors via Result (e.g. a clear "no report found yet"
  message distinct from a real I/O or parse error).
- Include a unit test using tempfile::tempdir() proving the CLI path reads a
  written concurrence_report.json correctly.

This is a proposal only. It does not authorize committing, merging, or
claiming COORDINATION_QUEUE.md row C40/C41 -- that requires owner review per
governance/LOCAL_AGENT_CONTROL_PLANE.md."""
