instruction = """
Audit orchestrator crate for ambient authority violations, task routing bounds, and supervisor budget enforcement.

[PRIOR AUDIT CONTEXT - Pass 8]:
In previous invariant audit pass(es), the following observations were noted:
Obs: IntelligenceEngine::new and new_async retain static AtomicUsize counters for fallback shared memory key generation, creating potential race conditions in multi-instance deployments. | Obs: SharedMemorySynapse::new_sync and new lack explicit size validation or bounds checking before allocation. | Obs: TaskRoutingEngine::new(specialists) and update_specialist_performance lack documented or enforced supervisor budget limits per task type or agent class. | Risk: Race condition in fallback shared memory key generation may cause collisions in multi-instance environments. | Risk: Ambient authority in SharedMemorySynapse allocation could lead to resource exhaustion if size validation is absent. | Risk: Lack of supervisor budget enforcement in TaskRoutingEngine may allow unbounded task routing and resource consumption.
Verify whether these conditions remain active, have been remediated in the codebase, or if any new invariant violations have emerged since.

[REVIEWER FEEDBACK - mimo, needs-changes from prior pass]:
Valid observations: static AtomicUsize counter race condition, missing SharedMemorySynapse size validation, no supervisor budget enforcement. The recommended remediation (per-instance fallback key, size validation, configurable budget limits) is sound in principle. However, no rust_draft provided.

REQUIRED CHANGES FOR THIS PASS:
1. Produce at least a skeletal implementation showing how per-instance key generation would work (e.g., thread-local counter or scoped atomic).
2. Show the size validation code for SharedMemorySynapse constructors.
3. Provide the supervisor budget enforcement logic for TaskRoutingEngine."""
