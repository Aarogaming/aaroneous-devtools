instruction = """
Research and investigate studio_hud FFI boundary panic containment, catch_unwind wrappers, and TickResult fault handling.

[PRIOR AUDIT CONTEXT - Pass 5]:
In previous invariant audit pass(es), the following observations were noted:
Obs: RFC-0006 Section 7 mandates `catch_unwind` at FFI boundary and `TickResult::PluginFaulted` handling, but `crates/studio_hud/src/plugin_api.rs` lacks any FFI boundary wrappers or panic isolation in `replay_commands()`. | Observed: `replay_commands()` executes `ui.label`, `ui.button`, etc., directly without `catch_unwind` wrappers. No panic isolation exists. | Obs: Current `PluginManager` only replays pre-loaded in-process cartridges without fault isolation; no tick execution path invokes external plugins via FFI. | Observed: `PluginManager` holds `static_cartridges` (in-process trait objects) and `replay_commands()` replays RFC-0006 command buffers. No FFI calls exist in current code; dynamic loading is removed per RFC-0006 Section 1. | Obs: No `TickResult::PluginFaulted` handling exists to signal plugin failure to host; no rate-limiting on plugin faults to prevent DoS via repeated panics. | Observed: `TickResult` enum exists in `plugin_api.rs` but is unused. No `plugin_tick` invocation path exists in `PluginManager`. No fault rate-limiting logic exists. | Risk: Uncaught panics in plugin_tick could corrupt host state if FFI boundary is not properly wrapped. | Risk: Missing TickResult::PluginFaulted handling leaves no mechanism to signal plugin failure to host. | Risk: No rate-limiting on plugin faults could allow DoS via repeated plugin panics.
Verify whether these conditions remain active, have been remediated in the codebase, or if any new invariant violations have emerged since."""
