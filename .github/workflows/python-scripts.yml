name: Python scripts tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - "scripts/**"
      - "governance/QUEUE_STATUSES.json"
      - "foundation/crates/foundation_cli/src/multithreader.rs"
      - ".github/workflows/python-scripts.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-scripts:
    name: Python scripts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Unit tests
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Golden vectors
        run: |
          if [ -f scripts/golden_vectors.py ]; then
            python scripts/golden_vectors.py --check
          else
            echo "no golden vectors in this revision"
          fi
