# BRIDGE VERSION: the Windows leg of Foundation CI, on main pushes only, so a pull request never pays for or waits on it and the
# merge gate (which treats a skipped or missing check as a failure) never sees it.
name: Foundation CI (Windows)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-ci-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation:
    name: Foundation (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          workspaces: foundation
      - name: Format
        run: cargo fmt --manifest-path foundation/Cargo.toml --all -- --check
      - name: Test
        env:
          DEVTOOLS_TEST_GIT: C:/Program Files/Git/cmd/git.exe
          DEVTOOLS_TEST_SSH_KEYGEN: C:/Windows/System32/OpenSSH/ssh-keygen.exe
          DEVTOOLS_TEST_CURL: C:/Windows/System32/curl.exe
          DEVTOOLS_TEST_SYSTEM_ROOT: C:/Windows
        run: cargo test --manifest-path foundation/Cargo.toml --workspace --all-targets --locked
      - name: Lint
        run: cargo clippy --manifest-path foundation/Cargo.toml --workspace --all-targets --locked -- -D warnings
